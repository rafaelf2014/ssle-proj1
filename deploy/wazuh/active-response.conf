<!-- active-responses for the manager's ossec.conf. firewall-drop blocks the srcip
     on the agent that reported it: 100300 = c2 handler, 100400 = dos client -->
<ossec_config>
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100300</rules_id>
    <timeout>120</timeout>
  </active-response>
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100400</rules_id>
    <timeout>120</timeout>
  </active-response>
</ossec_config>
