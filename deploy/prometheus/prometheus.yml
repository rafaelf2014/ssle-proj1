global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SOA services, reached via their k3s NodePorts on the master node
  # the per-target "service" label rides along onto every scraped metric
  - job_name: ssle-services
    metrics_path: /metrics
    static_configs:
      - targets: ["10.255.255.11:30050"]
        labels: { service: registry }
      - targets: ["10.255.255.11:30001"]
        labels: { service: ingestion }
      - targets: ["10.255.255.11:30002"]
        labels: { service: storage }
      - targets: ["10.255.255.11:30003"]
        labels: { service: analytics }
      - targets: ["10.255.255.11:30004"]
        labels: { service: sensor }

  # the protective resolver metrics (dns_decisions_total), up only in the dns scenario
  - job_name: dns-resolver
    static_configs:
      - targets: ["10.255.255.25:5005"]
        labels: { service: dns-resolver }

  # cpu of the ddos target (lxcfs shows node_exporter the capped single cpu)
  - job_name: node
    static_configs:
      - targets: ["10.255.255.22:9100"]
        labels: { host: apache-victim }

  # blackbox probes the apache url from outside, gives us up e down and latency
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://10.255.255.22/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
