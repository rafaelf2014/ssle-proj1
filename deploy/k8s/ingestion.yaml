apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: ssle
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingestion }
  template:
    metadata:
      labels: { app: ingestion }
    spec:
      containers:
        - name: ingestion
          image: 10.255.255.10:5000/ssle-ingestion:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: LISTEN_ADDR
              value: ":5001"
            - name: REGISTRY_URL
              value: "http://service-registry:5050"
            - name: STORAGE_URL
              value: "http://storage:5002"
            - name: SELF_URL
              value: "http://ingestion:5001"
            - name: SERVICE_ID_PREFIX
              value: "eu-pt.aveiro-dc1.rack2"
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /healthz, port: 5001 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: ssle
spec:
  type: NodePort
  selector: { app: ingestion }
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001
