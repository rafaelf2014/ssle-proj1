apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
  namespace: ssle
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: ssle
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: storage }
    spec:
      containers:
        - name: storage
          image: 10.255.255.10:5000/ssle-storage:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: LISTEN_ADDR
              value: ":5002"
            - name: DB_PATH
              value: "/data/storage.db"
            - name: REGISTRY_URL
              value: "http://service-registry:5050"
            - name: SELF_URL
              value: "http://storage:5002"
            - name: SERVICE_ID_PREFIX
              value: "eu-pt.aveiro-dc1.rack3"
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /healthz, port: 5002 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 96Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-data
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: ssle
spec:
  type: NodePort
  selector: { app: storage }
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30002
